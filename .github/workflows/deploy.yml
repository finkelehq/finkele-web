name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Encrypt protected pages
        run: |
          npx staticrypt public/floodmap.html \
            -p "${{ secrets.STATICRYPT_PASSWORD }}" \
            -d public \
            --remember 30 \
            --short \
            --template-title "Finkele Flood Map" \
            --template-button "Access Map" \
            --template-instructions "Enter the password to view the flood risk map." \
            --template-color-primary "#2166ac" \
            --template-color-secondary "#1a3a5c" \
            --template-placeholder "Password"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public
          exclude_assets: '.github'
          enable_jekyll: false
