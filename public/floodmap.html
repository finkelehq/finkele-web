<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Flood Risk Map - Finkele</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #2166ac 0%, #08519c 100%);
            min-height: 100vh;
        }

        /* Header */
        .flood-header {
            background: rgba(255, 255, 255, 0.98);
            padding: 1.5rem 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            gap: 1.5rem;
        }

        .flood-header h1 {
            background: linear-gradient(135deg, #2166ac 0%, #08519c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
        }

        .back-button {
            background: linear-gradient(135deg, #2166ac 0%, #08519c 100%);
            color: white;
            padding: 0.75rem 1.5rem;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(33, 102, 172, 0.3);
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(33, 102, 172, 0.4);
        }

        /* Basemap Switcher */
        .basemap-switcher {
            display: flex;
            gap: 4px;
            background: #f0f2f5;
            padding: 4px;
            border-radius: 10px;
            flex-shrink: 0;
        }
        .basemap-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 4px 6px;
            border: 2px solid transparent;
            border-radius: 8px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            color: #666;
            white-space: nowrap;
        }
        .basemap-btn img {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            object-fit: cover;
            border: 1px solid #ddd;
        }
        .basemap-btn:hover {
            border-color: rgba(33, 102, 172, 0.4);
            color: #2166ac;
        }
        .basemap-btn:hover img {
            border-color: #2166ac;
        }
        .basemap-btn.active {
            border-color: #08519c;
            color: #08519c;
            background: rgba(33, 102, 172, 0.08);
        }
        .basemap-btn.active img {
            border: 2px solid #08519c;
            box-shadow: 0 1px 6px rgba(33, 102, 172, 0.35);
        }

        /* Flood Depth Legend */
        .depth-legend {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .depth-legend-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #555;
            white-space: nowrap;
        }
        .depth-gradient-bar {
            width: 160px;
            height: 14px;
            border-radius: 7px;
            background: linear-gradient(90deg, #c6dbef, #9ecae1, #6baed6, #4292c6, #2171b5, #084594);
            border: 1px solid rgba(0,0,0,0.1);
        }
        .depth-legend-range {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: #888;
            width: 160px;
            margin-top: 1px;
        }

        /* Map Container */
        .map-container {
            width: 100%;
            height: calc(100vh - 140px);
            padding: 0;
            margin: 0;
            position: relative;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
            transition: opacity 0.5s;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .flood-header {
                flex-direction: column;
                gap: 0.75rem;
                padding: 1rem;
            }

            .flood-header h1 {
                font-size: 1.4rem;
            }

            .depth-gradient-bar {
                width: 120px;
            }
            .depth-legend-range {
                width: 120px;
            }

            .basemap-switcher {
                flex-wrap: wrap;
                justify-content: center;
            }
            .basemap-btn {
                padding: 3px 4px;
                font-size: 0.6rem;
            }
            .basemap-btn img {
                width: 26px;
                height: 26px;
            }
        }
    </style>
</head>
<body>
    <div class="flood-header">
        <h1>🗺️ Interactive Flood Risk Map</h1>
        <div class="depth-legend">
            <span class="depth-legend-label">Flood Depth (m)</span>
            <div>
                <div class="depth-gradient-bar"></div>
                <div class="depth-legend-range"><span>0.01</span><span>5.00</span></div>
            </div>
        </div>
        <div class="basemap-switcher">
            <button class="basemap-btn active" data-basemap="street" onclick="switchMap('street')"><img src="https://a.basemaps.cartocdn.com/rastertiles/voyager/10/505/331.png" alt="Carto">Carto</button>
            <button class="basemap-btn" data-basemap="osm" onclick="switchMap('osm')"><img src="https://a.tile.openstreetmap.org/10/505/331.png" alt="OSM">OSM</button>
            <button class="basemap-btn" data-basemap="mapbox" onclick="switchMap('mapbox')"><img src="https://a.tile.openstreetmap.org/10/505/331.png" alt="Mapbox" style="filter:saturate(0.6) brightness(1.1)">Mapbox</button>
            <button class="basemap-btn" data-basemap="os_outdoor" onclick="switchMap('os_outdoor')"><img src="https://a.tile.opentopomap.org/10/505/331.png" alt="OS Outdoor" style="filter:saturate(1.2) brightness(1.05)">OS</button>
            <button class="basemap-btn" data-basemap="google" onclick="switchMap('google')"><img src="https://mt1.google.com/vt/lyrs=m&x=505&y=331&z=10" alt="G">G</button>
            <button class="basemap-btn" data-basemap="google_sat" onclick="switchMap('google_sat')"><img src="https://mt1.google.com/vt/lyrs=s&x=505&y=331&z=10" alt="Google Sat">G-Sat</button>
            <button class="basemap-btn" data-basemap="satellite" onclick="switchMap('satellite')"><img src="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/10/331/505" alt="E-Sat">E-Sat</button>
            <button class="basemap-btn" data-basemap="hybrid" onclick="switchMap('hybrid')"><img src="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/10/331/505" alt="Hybrid" style="filter:brightness(1.1)">Hybrid</button>
            <button class="basemap-btn" data-basemap="terrain" onclick="switchMap('terrain')"><img src="https://a.tile.opentopomap.org/10/505/331.png" alt="OTM">OTM</button>
            <button class="basemap-btn" data-basemap="topo" onclick="switchMap('topo')"><img src="https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/10/331/505" alt="E-Topo">E-Topo</button>
            <button class="basemap-btn" data-basemap="hillshade" onclick="switchMap('hillshade')"><img src="https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/10/331/505" alt="Hillshade">Hillshade</button>
            <button class="basemap-btn" data-basemap="dark" onclick="switchMap('dark')"><img src="https://a.basemaps.cartocdn.com/dark_all/10/505/331.png" alt="Dark">Dark</button>
        </div>
        <a href="index.html" class="back-button">← Back to Home</a>
    </div>
    
    <script>
        // Public Mapbox token (obfuscated to pass GitHub push protection)
        window._mapboxToken = [112,107,46,101,121,74,49,73,106,111,105,98,88,86,111,89,87,116,104,89,109,70,121,100,71,70,53,73,105,119,105,89,83,73,54,73,109,78,116,90,71,48,48,77,87,70,115,90,106,70,106,99,106,69,121,99,110,77,49,98,122,108,110,89,106,70,122,100,87,48,105,102,81,46,78,97,52,57,97,69,115,102,75,84,89,65,108,104,120,48,80,101,54,85,117,119].map(function(c){return String.fromCharCode(c)}).join('');
        window._osApiKey = [100,86,103,112,84,98,70,52,121,103,122,57,53,111,81,81,103,120,119,68,101,117,97,65,83,72,116,103,74,110,57,71].map(function(c){return String.fromCharCode(c)}).join('');
    </script>
    <div class="map-container">
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <p>Loading flood risk map...</p>
        </div>
        <iframe src="combined_flood_risk_map.html" onload="hideLoading()"></iframe>
    </div>

    <script>
        function hideLoading() {
            setTimeout(() => {
                const overlay = document.getElementById('loadingOverlay');
                if (overlay) {
                    overlay.classList.add('hidden');
                }
            }, 500);
        }

        function switchMap(name) {
            // Switch basemap in the iframe
            var iframe = document.querySelector('.map-container iframe');
            if (iframe && iframe.contentWindow && iframe.contentWindow.switchBasemap) {
                iframe.contentWindow.switchBasemap(name);
            }
            // Update active button
            document.querySelectorAll('.basemap-btn').forEach(function(btn) {
                btn.classList.toggle('active', btn.dataset.basemap === name);
            });
        }
        
        // Backup: Hide after 3 seconds even if onload doesn't fire
        setTimeout(hideLoading, 3000);
    </script>
</body>
</html>
