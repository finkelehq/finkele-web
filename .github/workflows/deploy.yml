name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Validation steps (optional)
      - name: Validate HTML
        run: |
          npm install -g html-validate
          html-validate index.html --config .github/html-validate-config.json || echo "HTML validation completed with warnings"

      - name: Check Links
        run: |
          npm install -g markdown-link-check
          markdown-link-check README.md --config .github/link-check-config.json || echo "Link check completed with warnings"

      # Encrypt flood map pages with StatiCrypt (client-side AES-256)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Encrypt protected pages
        run: |
          npx staticrypt public/floodmap.html public/alert.html \
            -p "${{ secrets.STATICRYPT_PASSWORD }}" \
            -d public \
            --remember 30 \
            --short \
            --template-title "Finkele Flood Map" \
            --template-button "Access Map" \
            --template-instructions "Enter the password to view the flood risk map." \
            --template-color-primary "#2166ac" \
            --template-color-secondary "#1a3a5c" \
            --template-placeholder "Password"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public  # public not . (root) folder containing index.html
          exclude_assets: '.github'
          enable_jekyll: false
