<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Finkele Flood Alert — Live flood warnings, river gauges, and rainfall for England & Scotland">
<title>Finkele — Flood Alert</title>
<link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.css" />
<script src="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --panel: #1a1d27;
    --border: #2a2d3a;
    --text: #e4e4e7;
    --muted: #9ca3af;
    --severe: #dc2626;
    --warning: #f59e0b;
    --alert: #3b82f6;
    --normal: #22c55e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Top bar ───────────────────────────────────────── */
  .top-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .top-bar a.back {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: color 0.15s;
  }
  .top-bar a.back:hover { color: var(--text); }
  .top-bar h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
  .top-bar .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    animation: pulse 2s infinite;
    margin-left: 4px;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .top-bar .spacer { flex: 1; }

  /* ── Main layout ───────────────────────────────────── */
  .main-wrap {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  /* ── Sidebar ───────────────────────────────────────── */
  #sidebar {
    width: 420px;
    min-width: 420px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .stats-bar {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .stat-box {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    text-align: center;
  }
  .stat-box .stat-val { font-size: 20px; font-weight: 700; }
  .stat-box .stat-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .region-bar {
    display: flex;
    gap: 6px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .region-bar button {
    background: var(--bg);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 4px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .region-bar button:hover { border-color: var(--alert); color: var(--text); }
  .region-bar button.active { background: var(--alert); color: #fff; border-color: var(--alert); }

  .tab-bar {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .tab-bar button {
    flex: 1;
    padding: 12px 0;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .tab-bar button.active { color: var(--text); border-bottom-color: var(--alert); }

  .panel-content {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
  }
  .panel-content::-webkit-scrollbar { width: 6px; }
  .panel-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── Cards ─────────────────────────────────────────── */
  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: var(--alert); }
  .card .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .card .card-title {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 280px;
  }
  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge.severe  { background: var(--severe); color: #fff; }
  .badge.warning { background: var(--warning); color: #000; }
  .badge.alert   { background: var(--alert);   color: #fff; }
  .badge.normal  { background: var(--normal);  color: #000; }

  .card .card-body { font-size: 14px; color: var(--muted); line-height: 1.6; }
  .card.collapsed .card-body { display: none; }
  .card.collapsed .card-header { margin-bottom: 0; }
  .card .chevron {
    font-size: 14px; color: var(--muted);
    transition: transform 0.2s; margin-left: 8px; flex-shrink: 0;
  }
  .card.collapsed .chevron { transform: rotate(-90deg); }
  .card .card-meta { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .card .map-btn { font-size: 14px; padding: 2px 4px; border-radius: 4px; cursor: pointer; opacity: 0.6; transition: opacity 0.15s; }
  .card .map-btn:hover { opacity: 1; }
  .card .stat { display: inline-block; margin-right: 14px; color: var(--text); font-size: 14px; font-weight: 600; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }

  /* ── Map ────────────────────────────────────────────── */
  #map { flex: 1; min-width: 0; background: var(--bg); }
  .leaflet-tile-pane, .leaflet-container { background: var(--bg); }
  .leaflet-popup-content-wrapper { background: var(--panel) !important; color: var(--text) !important; border-radius: 8px !important; box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important; }
  .leaflet-popup-tip { background: var(--panel) !important; }
  .leaflet-popup-content { font-size: 13px; line-height: 1.6; }
  .leaflet-control-zoom a { background: var(--panel) !important; color: var(--text) !important; border-color: var(--border) !important; }

  .rain-chart { display: flex; align-items: flex-end; gap: 1px; height: 60px; margin: 8px 0; background: var(--bg); border-radius: 4px; padding: 4px; overflow: hidden; }
  .rain-bar { flex: 1; min-width: 2px; border-radius: 1px 1px 0 0; transition: height 0.3s; }

  .warning-pulse { animation: warningPulse 2s ease-in-out infinite; }
  @keyframes warningPulse { 0%,100%{opacity:0.15} 50%{opacity:0.5} }

  /* ── Geocoder dark-theme overrides ─────────────────── */
  .leaflet-control-geocoder { background: var(--panel) !important; border: 1px solid var(--border) !important; border-radius: 8px !important; box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important; }
  .leaflet-control-geocoder-form input { background: var(--panel) !important; color: var(--text) !important; border: none !important; font-size: 14px; }
  .leaflet-control-geocoder-form input::placeholder { color: var(--muted); }
  .leaflet-control-geocoder-icon { background-color: var(--panel) !important; filter: invert(0.85); width: 36px !important; height: 36px !important; background-size: 20px !important; border-radius: 8px !important; transition: background-color 0.15s; }
  .leaflet-control-geocoder-icon:hover { background-color: var(--bg) !important; }
  .leaflet-control-geocoder-alternatives { background: var(--panel) !important; border: 1px solid var(--border) !important; border-top: none !important; }
  .leaflet-control-geocoder-alternatives li { color: var(--text) !important; border-bottom: 1px solid var(--border) !important; }
  .leaflet-control-geocoder-alternatives li:hover, .leaflet-control-geocoder-alternatives .leaflet-control-geocoder-selected { background: var(--bg) !important; }

  /* ── Basemap control ────────────────────────────────── */
  .basemap-control { position: absolute; top: 10px; right: 10px; z-index: 1000; display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  .basemap-control button { background: var(--bg); color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .basemap-control button:hover { color: var(--text); border-color: var(--alert); }
  .basemap-control button.active { background: var(--alert); color: #fff; border-color: var(--alert); }

  /* ── Responsive ────────────────────────────────────── */
  @media (max-width: 900px) {
    .main-wrap { flex-direction: column-reverse; }
    #sidebar { width: 100%; min-width: 0; max-height: 50vh; border-right: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>

<!-- ── Top bar ─────────────────────────────────────────────────────────── -->
<div class="top-bar">
  <a href="index.html" class="back">← Back to Main</a>
  <div class="status-dot" id="statusDot"></div>
  <h1>Flood Alert</h1>
  <div class="spacer"></div>
  <small style="color:var(--muted)" id="lastUpdate"></small>
</div>

<!-- ── Main layout ─────────────────────────────────────────────────────── -->
<div class="main-wrap">
  <div id="sidebar">
    <div class="stats-bar">
      <div class="stat-box"><div class="stat-val" id="statWarnings">—</div><div class="stat-label">Warnings</div></div>
      <div class="stat-box"><div class="stat-val" id="statStations">—</div><div class="stat-label">Gauges</div></div>
      <div class="stat-box"><div class="stat-val" id="statRain">—</div><div class="stat-label">Rain 24h</div></div>
      <div class="stat-box"><div class="stat-val" id="statAlerts">—</div><div class="stat-label">Alerts</div></div>
    </div>
    <div class="region-bar" id="regionBar"><button class="active" data-region="all">All</button></div>
    <div class="tab-bar">
      <button class="active" data-tab="warnings">Warnings</button>
      <button data-tab="gauges">Gauges</button>
      <button data-tab="rainfall">Rainfall</button>
      <button data-tab="alerts">Alerts</button>
    </div>
    <div class="panel-content">
      <div id="tab-warnings" class="tab-panel active"></div>
      <div id="tab-gauges" class="tab-panel"></div>
      <div id="tab-rainfall" class="tab-panel"></div>
      <div id="tab-alerts" class="tab-panel"></div>
    </div>
  </div>
  <div id="map">
    <div class="basemap-control">
      <button class="active" data-base="dark">Dark</button>
      <button data-base="streets">Streets</button>
      <button data-base="satellite">Satellite</button>
    </div>
  </div>
</div>

<script>
// ── API base — update after Cloud Run deploy ────────────────────────────
const API = 'https://finkele-alert-f2zqdzq74a-od.a.run.app';  // Cloud Run (europe-west9)

const REFRESH_MS   = 30_000;
let   CATCHMENT    = [[51.30, -3.35], [56.00, 0.30]];
let   REGIONS      = {};
let   activeRegion = 'all';
const SEV_CLR = { severe:'#dc2626', warning:'#f59e0b', alert:'#3b82f6', normal:'#22c55e', unknown:'#6b7280' };

// ── Map ─────────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true }).fitBounds(CATCHMENT);
const baseLayers = {
  dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; CARTO &copy; OSM', subdomains: 'abcd', maxZoom: 20, keepBuffer: 6, detectRetina: true,
  }),
  streets: L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
    attribution: '&copy; Google', subdomains: '0123', maxZoom: 21, keepBuffer: 6,
  }),
  satellite: L.tileLayer('https://mt{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
    attribution: '&copy; Google', subdomains: '0123', maxZoom: 21, keepBuffer: 6,
  }),
};
let activeBase = 'dark';
baseLayers.dark.addTo(map);
document.querySelectorAll('.basemap-control button').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.base;
    if (key === activeBase) return;
    map.removeLayer(baseLayers[activeBase]);
    baseLayers[key].addTo(map);
    activeBase = key;
    document.querySelectorAll('.basemap-control button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});
L.Control.geocoder({
  position: 'bottomleft',
  placeholder: '🔍  Search city or address…',
  errorMessage: 'Nothing found.',
  geocoder: L.Control.Geocoder.nominatim({ geocodingQueryParams: { countrycodes: 'gb', limit: 8 } }),
}).addTo(map);
const canvasRenderer = L.canvas({ padding: 0.5 });
const warningLayer = L.layerGroup().addTo(map);
const gaugeLayer   = L.layerGroup().addTo(map);

// Fetch regions
fetch(`${API}/api/status`).then(r=>r.json()).then(s=>{
  if(s.catchment_bbox){const b=s.catchment_bbox; CATCHMENT=[[b.min_lat,b.min_lon],[b.max_lat,b.max_lon]]; map.fitBounds(CATCHMENT,{padding:[30,30]});}
  if(s.regions){REGIONS=s.regions; buildRegionBar(REGIONS);}
}).catch(()=>{});

function buildRegionBar(regions){
  const bar=document.getElementById('regionBar');
  for(const name of Object.keys(regions)){const btn=document.createElement('button');btn.textContent=name;btn.dataset.region=name;btn.addEventListener('click',()=>selectRegion(name));bar.appendChild(btn);}
  bar.querySelector('[data-region="all"]').addEventListener('click',()=>selectRegion('all'));
}
function selectRegion(name){
  activeRegion=name;
  document.querySelectorAll('.region-bar button').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.region-bar button[data-region="${name}"]`).classList.add('active');
  if(name==='all')map.fitBounds(CATCHMENT,{padding:[30,30]});
  else{const r=REGIONS[name];map.fitBounds([[r.min_lat,r.min_lon],[r.max_lat,r.max_lon]],{padding:[30,30]});}
  const{warnings,gauges,rainfall,alerts}=_last;renderWarnings(warnings);renderGauges(gauges);renderRainfall(rainfall);renderAlerts(alerts);updateStats(warnings,gauges,rainfall,alerts);updateMap(warnings,gauges);
}

// ── Tabs ────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-bar button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-bar button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});

// ── Helpers ─────────────────────────────────────────────────────────────
function badge(s){return `<span class="badge ${s}">${s}</span>`;}
function ago(iso){if(!iso)return '';const d=Date.now()-new Date(iso).getTime(),m=Math.floor(d/60000);if(m<1)return 'just now';if(m<60)return m+'m ago';if(m<1440)return Math.floor(m/60)+'h ago';return Math.floor(m/1440)+'d ago';}
function classify(v,h){if(v==null||h==null)return 'unknown';if(v>=h*0.9)return 'severe';if(v>=h*0.7)return 'warning';if(v>=h*0.5)return 'alert';return 'normal';}

// ── Fetch + render ──────────────────────────────────────────────────────
let _last={warnings:[],gauges:[],rainfall:[],alerts:[]};
async function refresh(){
  try{
    const[warnings,gauges,rainfall,alerts]=await Promise.all([
      fetch(`${API}/api/warnings`).then(r=>r.json()),
      fetch(`${API}/api/gauges`).then(r=>r.json()),
      fetch(`${API}/api/rainfall`).then(r=>r.json()),
      fetch(`${API}/api/alerts`).then(r=>r.json()),
    ]);
    _last={warnings,gauges,rainfall,alerts};
    renderWarnings(warnings);renderGauges(gauges);renderRainfall(rainfall);renderAlerts(alerts);
    updateStats(warnings,gauges,rainfall,alerts);updateMap(warnings,gauges);
    document.getElementById('statusDot').style.background='var(--normal)';
    document.getElementById('lastUpdate').textContent='Updated '+new Date().toLocaleTimeString();
  }catch(e){console.error('Refresh failed:',e);document.getElementById('statusDot').style.background='var(--severe)';}
}

function updateStats(w,g,r,a){
  document.getElementById('statWarnings').textContent=w.length;
  const gc=activeRegion==='all'?g.length:g.filter(x=>x.region===activeRegion).length;
  document.getElementById('statStations').textContent=gc;
  const mm=r.reduce((s,x)=>s+(x.total_mm||0),0);
  document.getElementById('statRain').textContent=mm.toFixed(0)+'mm';
  document.getElementById('statAlerts').textContent=a.length;
}

// ── Warnings ────────────────────────────────────────────────────────────
function renderWarnings(warnings){
  const el=document.getElementById('tab-warnings');
  if(!warnings.length){el.innerHTML='<div class="empty-state">✅ No active flood warnings</div>';return;}
  el.innerHTML=warnings.map(w=>{
    const desc=w.description?`<div style="font-size:12px;color:var(--muted);margin-bottom:6px;line-height:1.4">📍 ${w.description}</div>`:'';
    const sit=w.message||'No situation report';
    return `<div class="card collapsed" data-area="${w.area_code}">
      <div class="card-header" onclick="toggleCard(this)">
        <div class="card-title" title="${w.area_name||''}">${w.area_name||w.area_code}</div>
        <div class="card-meta"><small style="color:var(--muted);white-space:nowrap">${ago(w.updated_at)}</small>${badge(w.severity)}<span class="map-btn" onclick="event.stopPropagation();flyToWarning('${w.area_code}')" title="Show on map">📍</span><span class="chevron">▼</span></div>
      </div>
      <div class="card-body">${desc}<div style="line-height:1.5">${sit}</div><div style="margin-top:6px"><small>Updated ${ago(w.updated_at)} · Received ${ago(w.raised_at)}</small></div></div>
    </div>`;
  }).join('');
}
function toggleCard(h){h.closest('.card').classList.toggle('collapsed');}

// ── Gauges ──────────────────────────────────────────────────────────────
function renderGauges(gauges){
  const el=document.getElementById('tab-gauges');
  const f=activeRegion==='all'?gauges:gauges.filter(g=>g.region===activeRegion);
  if(!f.length){el.innerHTML=`<div class="empty-state">No gauge stations${activeRegion!=='all'?' in '+activeRegion:''}</div>`;return;}
  const sorted=[...f].sort((a,b)=>{const ra=a.typical_high?(a.value||0)/a.typical_high:0;const rb=b.typical_high?(b.value||0)/b.typical_high:0;return rb-ra;});
  el.innerHTML=sorted.slice(0,200).map(g=>{
    const sev=classify(g.value,g.typical_high);
    const pct=g.typical_high?((g.value||0)/g.typical_high*100).toFixed(0):'?';
    const ti=g.trend==='rising'?'↑':g.trend==='falling'?'↓':'→';
    const reg=g.region?`<span style="color:var(--muted);font-size:11px;margin-left:4px">${g.region}</span>`:'';
    const ar=g.atrisk?'<span style="background:#dc2626;color:#fff;font-size:10px;padding:1px 6px;border-radius:6px;margin-left:6px;font-weight:700">EA: AT RISK</span>':'';
    const rng=g.typical_high&&g.typical_low?`<div style="font-size:12px;color:var(--muted);margin-top:4px">Typical range: ${g.typical_low.toFixed(2)} – ${g.typical_high.toFixed(2)} m above datum · ${pct}% of high mark</div>`:'';
    return `<div class="card" onclick="flyToGauge(${g.lat},${g.lon})"><div class="card-header"><div class="card-title" title="${g.label||''}">${g.label||g.station_id}${reg}</div>${badge(sev)}${ar}</div><div class="card-body"><span class="stat">${g.value!=null?g.value.toFixed(2)+'m':'—'} ${ti}</span><span class="stat" style="color:var(--muted);font-size:12px">above station datum</span><br><span class="stat">${g.river_name||''}</span>${rng}<div style="margin-top:4px"><small>${ago(g.reading_dt)}</small></div></div></div>`;
  }).join('')+(f.length>200?`<div class="empty-state" style="padding:10px">Showing top 200 of ${f.length} gauges. Use region filter.</div>`:'');
}

// ── Rainfall ────────────────────────────────────────────────────────────
function renderRainfall(rainfall){
  const el=document.getElementById('tab-rainfall');
  if(!rainfall.length){el.innerHTML='<div class="empty-state">No rainfall data yet</div>';return;}
  const mm=rainfall.reduce((s,r)=>s+(r.total_mm||0),0);
  const prob=rainfall.reduce((s,r)=>s+(r.avg_prob||0),0)/rainfall.length;
  let sev='normal';if(mm>=50)sev='severe';else if(mm>=30)sev='warning';else if(mm>=15)sev='alert';
  el.innerHTML=`<div class="card"><div class="card-header"><div class="card-title">24h Rainfall Forecast</div>${badge(sev)}</div><div class="card-body"><span class="stat">${mm.toFixed(1)} mm total</span><span class="stat">${prob.toFixed(0)}% avg prob</span><div id="rainChartWrap" style="margin-top:8px"><div style="font-size:11px;color:var(--muted)">Hourly precipitation (next 48h) — loading…</div></div></div></div>`;
  fetch(`${API}/api/rainfall/hourly`).then(r=>r.json()).then(hours=>{
    if(!hours.length)return;
    const mx=Math.max(...hours.map(h=>h.mm_per_hour),0.5);
    const bars=hours.map((h,i)=>{const p=Math.max((h.mm_per_hour/mx)*100,1);const hr=h.forecast_time?new Date(h.forecast_time).getHours():i;const c=h.mm_per_hour>=4?'var(--severe)':h.mm_per_hour>=2?'var(--warning)':'var(--alert)';return `<div class="rain-bar" style="height:${p}%;background:${c}" title="${hr}:00 — ${h.mm_per_hour.toFixed(1)} mm, ${h.probability.toFixed(0)}% prob"></div>`;}).join('');
    document.getElementById('rainChartWrap').innerHTML=`<div style="font-size:11px;color:var(--muted);margin-bottom:2px">Hourly precipitation (next 48h)</div><div class="rain-chart">${bars}</div><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted)"><span>Now</span><span>+24h</span><span>+48h</span></div>`;
  }).catch(()=>{});
}

// ── Alerts ──────────────────────────────────────────────────────────────
function renderAlerts(alerts){
  const el=document.getElementById('tab-alerts');
  if(!alerts.length){el.innerHTML='<div class="empty-state">No alerts recorded</div>';return;}
  const tl={ea_warning:'⚠️ EA Warning',gauge_threshold:'📊 Gauge',forecast:'🌧️ Forecast'};
  el.innerHTML=alerts.map(a=>{
    const lb=tl[a.trigger_type]||a.trigger_type;
    const ar=a.message&&a.message.includes('[EA: at risk]')?'<span style="background:#dc2626;color:#fff;font-size:10px;padding:1px 6px;border-radius:6px;margin-left:4px;font-weight:700">EA: AT RISK</span>':'';
    const msg=(a.message||'No details').replace(' [EA: at risk]','');
    return `<div class="card"><div class="card-header"><div class="card-title">${lb}${ar}</div>${badge(a.severity)}</div><div class="card-body">${msg}<br><small>${ago(a.created_at)}</small></div></div>`;
  }).join('');
}

// ── Map ─────────────────────────────────────────────────────────────────
function updateMap(warnings,gauges){
  warningLayer.clearLayers();
  for(const w of warnings){
    const color=SEV_CLR[w.severity]||SEV_CLR.unknown;
    fetch(`${API}/api/area/${w.area_code}/polygon`).then(r=>r.ok?r.json():null).then(geo=>{
      if(!geo)return;let lat,lon;
      if(geo.type==='Point'){[lon,lat]=geo.coordinates;}
      else if(geo.type==='Feature'&&geo.geometry){[lon,lat]=geo.geometry.coordinates;}
      else{L.geoJSON(geo,{style:{color,fillColor:color,fillOpacity:0.2,weight:2},onEachFeature:(f,l)=>{l.bindPopup(`<strong>${w.area_name||w.area_code}</strong><br>Severity: <b style="color:${color}">${w.severity}</b><br>${w.message?(w.message).substring(0,200):''}`)}}).addTo(warningLayer);return;}
      L.circleMarker([lat,lon],{radius:16,fillColor:color,fillOpacity:0.15,color,weight:1.5,className:'warning-pulse'}).addTo(warningLayer);
      const m=L.circleMarker([lat,lon],{radius:8,fillColor:color,fillOpacity:0.9,color:'#fff',weight:2}).addTo(warningLayer);
      m.bindPopup(`<strong>${w.area_name||w.area_code}</strong><br>Severity: <b style="color:${color}">${w.severity}</b><br>${w.message?(w.message).substring(0,200):''}`);
      m._areaCode=w.area_code;
    }).catch(()=>{});
  }

  gaugeLayer.clearLayers();
  for(const g of gauges){
    if(g.lat==null||g.lon==null)continue;
    const sev=classify(g.value,g.typical_high);const color=SEV_CLR[sev]||SEV_CLR.unknown;
    const m=L.circleMarker([g.lat,g.lon],{radius:7,fillColor:color,fillOpacity:0.9,color:'#fff',weight:1.5,renderer:canvasRenderer}).addTo(gaugeLayer);
    const ti=g.trend==='rising'?'↑':g.trend==='falling'?'↓':'→';
    const ar=g.atrisk?'<br><b style="color:#dc2626">⚠ EA: at risk</b>':'';
    const pct=g.typical_high?`${((g.value||0)/g.typical_high*100).toFixed(0)}% of high mark`:'';
    m.bindPopup(`<strong>${g.label||g.station_id}</strong><br>River: ${g.river_name||'—'}<br>Level: <b>${g.value!=null?g.value.toFixed(2)+' m':'—'}</b> above datum ${ti}<br>Typical: ${g.typical_low??'?'} – ${g.typical_high??'?'} m ${pct?'('+pct+')':''}<br>Status: <b style="color:${color}">${sev}</b>${ar}<br><small>${ago(g.reading_dt)}</small>`);
    m.bindTooltip(`${g.label||g.station_id}: ${g.value!=null?g.value.toFixed(2)+'m':'—'} ${ti}`,{permanent:false,direction:'top',offset:[0,-8]});
  }
}

function flyToWarning(code){warningLayer.eachLayer(l=>{if(l._areaCode===code){map.flyTo(l.getLatLng(),13);l.openPopup();}});}
function flyToGauge(lat,lon){if(lat&&lon)map.flyTo([lat,lon],14);}

// ── Go ──────────────────────────────────────────────────────────────────
refresh();
setInterval(refresh,REFRESH_MS);
</script>
</body>
