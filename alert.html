<!-- Updated: Ensure this is the dynamic loader for Cloud Run, not encrypted -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finkele Flood Alert</title>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; min-height: 100vh; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; background: #fff; }
    #alert-container { width: 100vw; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid #2166ac; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 40px auto; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .error { color: #b00; text-align: center; margin-top: 40px; }
  </style>
</head>
<body>
  <div id="alert-container">
    <div class="loader"></div>
  </div>
  <script>
    fetch('https://finkele-alert-2zzizltsla-od.a.run.app')
      .then(async response => {
        if (!response.ok) throw new Error('Failed to load alert page.');
        const html = await response.text();
        document.open();
        document.write(html);
        document.close();
      })
      .catch(err => {
        const container = document.getElementById('alert-container');
        if (container) {
          container.innerHTML = `<div class=\"error\">Could not load alert page.<br>${err.message}</div>`;
        } else {
          document.body.innerHTML = `<div class=\"error\">Could not load alert page.<br>${err.message}</div>`;
        }
      });
  </script>
</body>
</html>
